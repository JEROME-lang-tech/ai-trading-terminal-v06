# Fly.io — flyctl deploy
app = "ai-trading-terminal"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  DB_PATH = "/data/trader.db"
  PROFILE = "validated"
  VENUE = "simulator"
  ACCOUNT_TYPE = "demo"
  TICK_SECONDS = "300"

[[mounts]]
  source = "trader_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false      # keep the bot running
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
